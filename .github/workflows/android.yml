name: Android

on:
  push:
    branches: ["main", "workbench/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Resolve Android dependencies
        run: gradle :app:dependencies --configuration debugRuntimeClasspath --stacktrace
      - name: Process Android resources
        run: gradle :app:processDebugResources --stacktrace
      - name: Compile Kotlin and capture exact diagnostics
        id: kotlin_compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin --stacktrace --info 2>&1 | tee kotlin-compile.log
      - name: Test debug unit tests and capture exact diagnostics
        id: unit_test
        if: always() && steps.kotlin_compile.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --info 2>&1 | tee unit-test.log
      - name: Assemble debug APK and capture exact diagnostics
        id: assemble_debug
        if: always() && steps.kotlin_compile.outcome == 'success' && steps.unit_test.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --info 2>&1 | tee assemble-debug.log
      - name: Persist failed diagnostics on current workbench branch
        if: always() && github.event_name == 'push' && (steps.kotlin_compile.outcome == 'failure' || steps.unit_test.outcome == 'failure' || steps.assemble_debug.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          if [[ "${{ steps.kotlin_compile.outcome }}" == "failure" ]]; then
            test -s kotlin-compile.log
            cp kotlin-compile.log "ci-diagnostics/kotlin-compile-${SOURCE_SHA}.log"
          fi
          if [[ "${{ steps.unit_test.outcome }}" == "failure" ]]; then
            test -s unit-test.log
            cp unit-test.log "ci-diagnostics/unit-test-${SOURCE_SHA}.log"
          fi
          if [[ "${{ steps.assemble_debug.outcome }}" == "failure" ]]; then
            test -s assemble-debug.log
            cp assemble-debug.log "ci-diagnostics/assemble-debug-${SOURCE_SHA}.log"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-diagnostics/
          git commit -m "Persist Android diagnostics for ${SOURCE_SHA} [skip ci]"
          git push origin "HEAD:${SOURCE_BRANCH}"
      - name: Restore real CI failure result
        if: always() && (steps.kotlin_compile.outcome == 'failure' || steps.unit_test.outcome == 'failure' || steps.assemble_debug.outcome == 'failure')
        run: exit 1
      - name: Verify debug APK
        if: steps.assemble_debug.outcome == 'success'
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
