name: Android

on:
  push:
    branches: ["main", "workbench/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Resolve Android dependencies
        run: gradle :app:dependencies --configuration debugRuntimeClasspath --stacktrace
      - name: Process Android resources
        run: gradle :app:processDebugResources --stacktrace
      - name: Run Android checks and capture exact diagnostics
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p ci-diagnostics

          gradle :app:compileDebugKotlin --stacktrace --info 2>&1 | tee kotlin-compile.log
          kotlin_status=${PIPESTATUS[0]}
          if [[ ${kotlin_status} -ne 0 ]]; then
            cp kotlin-compile.log "ci-diagnostics/kotlin-compile-${SOURCE_SHA}.log"
          fi

          unit_status=125
          if [[ ${kotlin_status} -eq 0 ]]; then
            gradle :app:testDebugUnitTest --stacktrace --info 2>&1 | tee unit-test.log
            unit_status=${PIPESTATUS[0]}
            if [[ ${unit_status} -ne 0 ]]; then
              cp unit-test.log "ci-diagnostics/unit-test-${SOURCE_SHA}.log"
            fi
          fi

          assemble_status=125
          if [[ ${kotlin_status} -eq 0 && ${unit_status} -eq 0 ]]; then
            gradle :app:assembleDebug --stacktrace --info 2>&1 | tee assemble-debug.log
            assemble_status=${PIPESTATUS[0]}
            if [[ ${assemble_status} -ne 0 ]]; then
              cp assemble-debug.log "ci-diagnostics/assemble-debug-${SOURCE_SHA}.log"
            fi
          fi

          printf 'SOURCE_SHA=%s\nKOTLIN_STATUS=%s\nUNIT_STATUS=%s\nASSEMBLE_STATUS=%s\n' \
            "${SOURCE_SHA}" "${kotlin_status}" "${unit_status}" "${assemble_status}" > ci-status.env
          exit 0
      - name: Persist failed diagnostics on current workbench branch
        if: always() && github.event_name == 'push'
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          source ci-status.env
          if [[ ${KOTLIN_STATUS} -eq 0 && ${UNIT_STATUS} -eq 0 && ${ASSEMBLE_STATUS} -eq 0 ]]; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-diagnostics/
          if git diff --cached --quiet; then
            echo "Expected a diagnostic log for failed source ${SOURCE_SHA}" >&2
            exit 1
          fi
          git commit -m "Persist Android diagnostics for ${SOURCE_SHA} [skip ci]"
          git push origin "HEAD:${SOURCE_BRANCH}"
      - name: Restore real CI result
        if: always()
        shell: bash
        run: |
          source ci-status.env
          if [[ ${KOTLIN_STATUS} -ne 0 || ${UNIT_STATUS} -ne 0 || ${ASSEMBLE_STATUS} -ne 0 ]]; then
            exit 1
          fi
      - name: Verify debug APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
