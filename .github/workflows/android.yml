name: Android

on:
  push:
    branches: ["main", "workbench/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Resolve Android dependencies
        run: gradle :app:dependencies --configuration debugRuntimeClasspath --stacktrace
      - name: Process Android resources
        run: gradle :app:processDebugResources --stacktrace
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: uma-collector-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
